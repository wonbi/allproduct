name: Sync catalog from 유통시트

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sync
        env:
          BALJUSEO_TOKEN: ${{ secrets.BALJUSEO_TOKEN }}
        run: node scripts/sync-catalog.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/products.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          git commit -m "Sync catalog from 유통시트 [skip ci]"
          git push
