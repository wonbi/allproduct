name: Sync catalog from 유통시트

on:
  # 2026-08-31: index.html이 baljuseo가 직접 호스팅하는 data/allproduct.json을
  # 매번 실시간으로 바로 읽어오도록 바뀌면서, 이 워크플로우가 만드는
  # data/products.json은 더 이상 어디서도 안 쓰인다. 정기 실행은 꺼두고
  # (baljuseo 쪽 인증 구조 변경 이후 계속 실패만 하고 있었음),
  # 필요할 때 수동으로만 돌릴 수 있게 workflow_dispatch만 남긴다.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sync
        env:
          BALJUSEO_TOKEN: ${{ secrets.BALJUSEO_TOKEN }}
        run: node scripts/sync-catalog.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/products.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          git commit -m "Sync catalog from 유통시트 [skip ci]"
          git push
