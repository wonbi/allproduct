<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mv_theme')==='dark'?'dark':'light')}catch(e){}</script>
<title>마스터 유통 상품 시세판</title>
<style>
/* 경매장 전광판 컨셉 — 어둡게/밝게 두 테마. 색상은 전부 변수로 빼서 [data-theme]로 스위치. */
:root{
  --board:#15181c;--panel:#1b1f25;--panel-2:#20252c;--line:#2a3038;--line-2:#232830;
  --ink:#e9ecef;--steel:#8c98a6;--steel-2:#5f6b78;
  --amber:#e8a63f;--amber-dim:#8a6524;--up:#e2705a;--down:#5fa6dc;--green:#4fb98a;
}
:root[data-theme="light"]{
  --board:#eef0f3;--panel:#ffffff;--panel-2:#f2f4f6;--line:#dde1e6;--line-2:#e8ebef;
  --ink:#1b1f24;--steel:#5a6572;--steel-2:#8b95a1;
  --amber:#b5720a;--amber-dim:#9c6a1f;--up:#c23616;--down:#1f6fb2;--green:#1f8f63;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--board);color:var(--ink);
  font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  line-height:1.45;padding-bottom:56px;-webkit-font-smoothing:antialiased;
  transition:background-color .15s,color .15s}
.themetoggle{position:fixed;top:14px;right:16px;z-index:80;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.themetoggle:hover{border-color:var(--amber)}
.wrap{max-width:1800px;margin:0 auto;padding:0 28px}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── 관리자 모드 ── */
.adminbar{display:none;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  background:var(--amber);color:#1a1408;font-size:12.5px;font-weight:700;padding:9px 16px;text-align:center}
.adminbar b{font-weight:800}
.adminbar button{border:1.5px solid #1a1408;background:transparent;color:#1a1408;border-radius:7px;
  padding:4px 11px;font-size:11.5px;font-weight:800;cursor:pointer}
.adminbar button:hover{background:#1a1408;color:var(--amber)}
#adminLink{color:var(--steel-2);text-decoration:underline;cursor:pointer}
#adminLink:hover{color:var(--steel)}
.pinq{font-size:13.5px;color:var(--steel);font-weight:700}
.mprice .pinq{font-size:16px}
.editable{cursor:pointer;border-bottom:1.5px dashed var(--amber-dim);transition:.12s}
.editable:hover{color:var(--ink);border-bottom-color:var(--amber)}
.pedit{width:110px;font-size:15px;background:var(--panel);border:1.5px solid var(--amber);border-radius:6px;
  padding:3px 7px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:inherit}
.editedTag{font-size:9.5px;font-weight:800;color:#1a1408;background:var(--amber);border-radius:4px;
  padding:1px 5px;margin-left:6px;vertical-align:1px}
.exportfab{display:none;position:fixed;right:18px;bottom:18px;z-index:70;background:var(--amber);color:#1a1408;
  border:none;border-radius:24px;padding:13px 20px;font-weight:800;font-size:13px;cursor:pointer;
  box-shadow:0 6px 22px rgba(0,0,0,.45);font-family:inherit}
.exportfab:hover{background:#f0b862}

/* ── 상단 전광판 ── */
.board-top{border-bottom:1px solid var(--line);padding:20px 0 16px}
.bt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.bt-title{display:flex;align-items:center;gap:12px}
.bt-title .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(79,185,138,.14);flex:none}
h1{font-size:27px;font-weight:800;letter-spacing:-.4px}
.bt-sub{font-size:13px;color:var(--steel);margin-top:4px}
.readout{display:flex;gap:32px;flex-wrap:wrap}
.ro{display:flex;flex-direction:column;gap:4px}
.ro .v{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;line-height:1}
.ro .k{font-size:11px;color:var(--steel-2);letter-spacing:.09em}
.ro.amber .v{color:var(--amber)}.ro.up .v{color:var(--up)}.ro.down .v{color:var(--down)}

.rule{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:8px;padding:12px 16px;font-size:13px;color:var(--steel);line-height:1.7}
.rule b{color:var(--ink)}

/* ── 본문 ── */
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:20px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}

.rail{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:8px;display:flex;flex-direction:column;gap:3px}
@media(max-width:760px){.rail{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}}
.rail-lbl{font-size:11px;color:var(--steel-2);letter-spacing:.11em;padding:7px 10px 8px}
@media(max-width:760px){.rail-lbl{display:none}}
.wtab{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;
  border-radius:8px;padding:12px 12px;cursor:pointer;transition:background .12s;text-align:left;width:100%;flex:none}
.wtab .n{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.wtab .c{font-size:12px;color:var(--steel-2);font-variant-numeric:tabular-nums}
.wtab:hover{background:var(--panel-2)}
.wtab.on{background:var(--amber)}
.wtab.on .n{color:#1a1408}.wtab.on .c{color:#5c4310}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:170px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:9px;padding:13px 16px;font-size:17px;outline:none;font-family:inherit}
.search:focus{border-color:var(--amber)}
.search::placeholder{color:var(--steel-2)}
.sorts{display:flex;gap:6px;flex-wrap:wrap}
.sortbtn{border:1px solid var(--line);background:var(--panel);color:var(--steel);border-radius:8px;
  padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.12s;white-space:nowrap}
.sortbtn:hover{border-color:var(--steel-2);color:var(--ink)}
.sortbtn.on{background:var(--panel-2);border-color:var(--amber);color:var(--amber)}
@media(max-width:760px){
  .wrap{padding:0 14px}
  .toolbar{flex-direction:column;align-items:stretch}
  .sorts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .sorts::-webkit-scrollbar{display:none}
  .sortbtn{flex:none}
  /* 세로 사이드바용 width:100%가 가로 스크롤 레일에 그대로 남아있으면
     탭 하나가 화면 전체 폭을 먹어버린다 — 가로 모드에선 내용 너비로 되돌린다. */
  .wtab{width:auto;justify-content:flex-start;gap:9px}
  .rail{gap:6px}
}

.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px;

.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;min-width:760px}
thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size:11.5px;font-weight:800;
  color:var(--steel-2);letter-spacing:.1em;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
thead th.r{text-align:right}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--panel-2)}
td.item{min-width:320px}
.itemcell{display:flex;align-items:center;gap:15px}
.th{width:78px;height:58px;border-radius:7px;object-fit:cover;background:var(--panel-2);flex:none;display:block}
.th-none{width:78px;height:58px;border-radius:7px;flex:none;border:1px solid var(--line-2);

.iname{font-weight:700;letter-spacing:-.2px;line-height:1.35;font-size:16.5px;display:flex;align-items:flex-start;gap:7px}
.iname a{text-decoration:none;border-bottom:1px dashed var(--steel-2)}
.iname a:hover{border-bottom-color:var(--amber);color:var(--amber)}
.cpbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;font-size:12px;padding:2px 7px;

.cpbtn:hover{border-color:var(--amber);color:var(--amber)}
.itag{font-size:12.5px;color:var(--steel-2);margin-top:3px}
.itag .tx{color:var(--up)}

td.spec{font-size:13.5px;color:var(--steel);max-width:380px;line-height:1.6;white-space:normal}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pcur{font-size:21px;font-weight:800;color:var(--amber);letter-spacing:-.3px}
.pcur small{font-size:13px;color:var(--amber-dim);margin-left:2px;font-weight:700}
.pask{font-size:14.5px;color:var(--amber-dim);font-weight:700}
.pold{display:block;font-size:12.5px;color:var(--steel-2);text-decoration:line-through;line-height:1.5}
.chg{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.flat{color:var(--steel-2);font-weight:600}
.chg .pct{display:block;font-size:12px;font-weight:600;opacity:.75}
td.ship{font-size:13.5px;color:var(--steel);white-space:nowrap}
td.ship b{color:var(--ink);font-variant-numeric:tabular-nums}
.free{color:var(--green);font-weight:700}
td.cut{font-size:13px;color:var(--steel);white-space:nowrap}
.emptyrow td{text-align:center;color:var(--steel-2);padding:52px 0;font-size:15px}

/* ── 모바일 카드 (표는 좁은 화면에서 가로 스크롤이 필요해 720px부터 카드로 전환) ── */

.mtop{display:flex;gap:12px}
.mth{width:76px;height:76px;border-radius:9px;object-fit:cover;background:var(--panel);flex:none;display:block}
.mth-none{width:76px;height:76px;border-radius:9px;flex:none;border:1px solid var(--line-2);
  background:repeating-linear-gradient(135deg,var(--board),var(--board) 5px,var(--line) 5px,var(--line) 10px)}
.mhead{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.mname{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.35;display:flex;align-items:flex-start;gap:7px}
.mname a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--steel-2)}
.mspec{font-size:13.5px;color:var(--steel);line-height:1.6;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.mfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.mprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mprice .pcur{font-size:24px}
.mship{font-size:13px;color:var(--steel);text-align:right;line-height:1.5;white-space:nowrap}
.mship b{color:var(--ink);font-variant-numeric:tabular-nums}
.mempty{text-align:center;color:var(--steel-2);padding:52px 0;font-size:15px}

.load{text-align:center;padding:80px 0;color:var(--steel);font-size:14px}
.load .retry{margin-top:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
.load .retry:hover{border-color:var(--amber);color:var(--amber)}
.load .err{font-size:12px;color:var(--steel-2);margin-top:8px}

footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--steel-2);
  text-align:center;line-height:1.8}
footer b{color:var(--steel)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--board);
  padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:99}

.th,.mth{cursor:zoom-in}
.lightbox{display:none;position:fixed;inset:0;background:rgba(10,12,14,.92);z-index:200;
  align-items:center;justify-content:center;padding:32px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.6);cursor:default;
  transition:filter .2s}
.lightbox img.loading{filter:blur(9px) brightness(.85)}
.lightbox-close{position:fixed;top:18px;right:22px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.lightbox-close:hover{border-color:var(--amber);color:var(--amber)}
</style></head><body>
<button class="themetoggle" id="themeToggle" aria-label="테마 전환">🌙</button>
<div class="adminbar" id="adminBar">🔓 <b>관리자 모드</b> — 실제 공급가가 보이고 있습니다 · 가격을 클릭하면 수정돼요 <button id="btnLock">잠그기</button></div>
<div class="wrap">

<div class="board-top">
  <div class="bt-row">
    <div class="bt-title"><span class="dot"></span>
      <div><h1>마스터 유통 상품 시세판</h1><div class="bt-sub" id="sub">거래처 전용 · 불러오는 중…</div></div>

      <div class="ro"><span class="v" id="roItems">—</span><span class="k">취급 품목</span></div>

</div>

      <input class="search" id="q" type="search" placeholder="상품명 검색 (전체 창고) — 예: 갈치, 새우, 한우, 김치…" autocomplete="off">

<script>
/* ─────────────────────────────────────────────────────────────
   데이터 출처 : data/products.json  (아래 스키마 참조 — README.md)
   서비스계정/인증키 없음. JSON 파일만 갈아끼우면 화면이 바뀝니다.
   ───────────────────────────────────────────────────────────── */
const DATA_URL = 'data/products.json';
const pkey = s => String(s||'').replace(/\s+/g,'').toLowerCase();

async function loadCatalog(){
  const res = await fetch(DATA_URL, { cache:'no-cache' });
  if (!res.ok) throw new Error('상품 데이터를 읽지 못했습니다 (' + res.status + ')');
  const doc = await res.json();
  const rows = Array.isArray(doc) ? doc : (doc.products || []);
  if (!rows.length) throw new Error('상품 데이터가 비어 있습니다');
  DOC_META = { updatedAt: doc.updatedAt || '', supplier: doc.supplier || '' };

  const order = [], byWh = {};
  rows.forEach(r => {
    const wh = (r.warehouse || '미지정').trim();
    if (order.indexOf(wh) < 0) { order.push(wh); byWh[wh] = []; }
    const cur = (r.supplyPrice == null || r.supplyPrice === '') ? null : Number(r.supplyPrice);
    const old = (r.previousPrice == null || r.previousPrice === '') ? null : Number(r.previousPrice);
    byWh[wh].push({
      name   : String(r.name || '').trim(),
      url    : r.link || '',
      price  : { old: old, cur: cur, dir: (cur!=null&&old!=null) ? (cur>old?'up':(cur<old?'down':'')) : '' },
      ship   : Number(r.shipFee || 0),
      courier: r.courier || '',
      tax    : r.tax || '',
      cut    : r.orderCutoff || '',
      exp    : r.shelfLife || '',
      ref    : r.note || '',
      srcWh  : (r.sourceWarehouse || '').trim(),
      spec   : Array.isArray(r.spec) ? r.spec : (r.spec ? [r.spec] : []),
      img    : r.image || '',
      cat0   : r.category || ''
    });
  });
  // 한 탭(창고)에 실제 출고 창고가 다른 상품이 섞여 있으면(예: 당일생물, 단독 특가류)
  // 행마다 srcWh 배지를 보여주고, 배송비 안내 문구도 다르게 표시한다.
  return order.filter(w => byWh[w].length).map(w => {
    const distinct = new Set(byWh[w].map(p => p.srcWh).filter(Boolean));
    return { wh: w, products: byWh[w], mixed: distinct.size > 1 };
  });
}
let DOC_META = {};
// ── 렌더링 ──
const CATRULES=[

let GROUPS=[],MEDIA={},PBYID={},EDITCOUNT=0;
const st={q:'',wi:0,sort:'sheet'};
const $=id=>document.getElementById(id);
function won(n){return(n||0).toLocaleString('ko-KR');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── 테마(밝게/어둡게) ── data-theme 속성은 <head>의 인라인 스크립트가 이미
// localStorage 값으로 먼저 세팅해둔다(깜빡임 방지). 여기서는 토글 아이콘만 맞춘다.
const THEME_KEY='mv_theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem(THEME_KEY,t);

/* ─────────────────────────────────────────────────────────────
   관리자 모드 — 서버가 없는 정적 사이트라 "로그인"은 브라우저 안에서만
   판단한다. 비밀번호를 평문으로 두지 않으려고 SHA-256 해시만 비교하지만,
   이건 일반 방문자가 가격을 못 보게 가리는 용도지 소스를 볼 수 있는
   사람까지 막는 진짜 보안은 아니다 — 그러려면 서버가 있어야 한다.
   ───────────────────────────────────────────────────────────── */
const ADMIN_HASH='af9465324f57a5e93d82346dfd555a1ecb8947c175eef2da2a26170b7817ddda';
const ADMIN_KEY='mv_admin';
function isAdmin(){return localStorage.getItem(ADMIN_KEY)==='1';}
async function sha256Hex(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const pw=prompt('관리자 비밀번호를 입력하세요');
  if(pw==null)return;
  const h=await sha256Hex(pw);
  if(h===ADMIN_HASH){
    localStorage.setItem(ADMIN_KEY,'1');
    toast('관리자 모드로 전환됐어요');
    updateAdminUI();render();
  }else{
    toast('비밀번호가 올바르지 않습니다');
  }
}
function lockAdmin(){
  localStorage.removeItem(ADMIN_KEY);
  toast('잠갔습니다 — 공급가가 다시 가려집니다');
  updateAdminUI();render();
}
function updateAdminUI(){
  const on=isAdmin();
  $('adminBar').style.display=on?'flex':'none';
  const link=$('adminLink');
  if(link)link.textContent=on?'🔓 관리자 모드 (여기서 잠그기)':'관리자';
  $('roViewsWrap').style.display=on?'flex':'none';
  updateEditBadge();
}

/* ─────────────────────────────────────────────────────────────
   조회수 — 서버가 없어서 무료 뱃지 카운터(visitor-badge.laobi.icu, Cloudflare
   Workers 기반)를 씀. countapi.xyz는 서비스 자체가 죽어서 교체함(카운트 0으로 재시작).
   뱃지 이미지 자체가 숫자를 그려서 주기 때문에 fetch·JSON 파싱이 필요 없다 — 이미지 로드
   자체가 곧 "1회 조회 기록"이라 페이지를 열 때마다(관리자 여부와 무관하게) 자동 집계되고,
   관리자 모드일 때만 그 뱃지를 보여준다. 뱃지 로드에 실패하면 통계칸 자체를 숨긴다.
   ───────────────────────────────────────────────────────────── */
function bumpViewCounter(){
  const img=$('roViewsImg');
  if(!img)return;
  img.onerror=()=>{ $('roViewsWrap').style.display='none'; };
  img.src='https://visitor-badge.laobi.icu/badge?page_id=wonbi-allproduct-index-v2&color=b5720a';
}
function updateEditBadge(){
  const b=$('exportBtn');
  if(isAdmin()&&EDITCOUNT>0){b.style.display='inline-flex';b.textContent='⬇ 변경사항 내보내기 ('+EDITCOUNT+')';}
  else{b.style.display='none';}
}
function buildExportJson(){
  const products=[];
  GROUPS.forEach(g=>g.products.forEach(p=>{
    products.push({
      warehouse:g.wh, sourceWarehouse:p.srcWh||'', category:p.cat0||p.cat||'',
      name:p.name, spec:p.spec||[], supplyPrice:p.price.cur, previousPrice:p.price.old,
      tax:p.tax||'', courier:p.courier||'', shipFee:p.ship||0, orderCutoff:p.cut||'',
      shelfLife:p.exp||'', image:p.img||'', note:p.ref||''
    });
  }));
  return {updatedAt:kstStamp(), supplier:(DOC_META&&DOC_META.supplier)||'마스터 유통', products};
}
// 자동 동기화 스크립트(scripts/sync-catalog.js)와 같은 형식(KST, 분 단위)으로 시각을 남긴다.
function kstStamp(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>parts.find(p=>p.type===t).value;
  return g('year')+'-'+g('month')+'-'+g('day')+' '+g('hour')+':'+g('minute');
}
function commitPriceEdit(id,rawVal){
  const p=PBYID[id];if(!p)return;
  const v=parseInt(String(rawVal).replace(/[^\d]/g,''),10);
  if(isNaN(v)||v<0||v===p.price.cur){render();return;}
  if(p.price.cur!=null)p.price.old=p.price.cur;
  p.price.cur=v;
  if(!p.__edited){p.__edited=true;EDITCOUNT++;}
  updateEditBadge();
  render();
}

// 원본 사진이 장당 0.3~1MB라 그대로 쓰면 거래처 휴대폰에서 느림 → 리사이즈 프록시로 썸네일.
// 표 안 썸네일은 46×35라 훨씬 작게 받는다. 프록시가 죽으면 원본, 원본도 실패하면 빈 칸으로 단계 폴백.
function thumbUrl(u){
  // 레포에 담긴 이미지는 이미 작게 만들어 두어 프록시가 필요 없다. 외부 URL이면 리사이즈 프록시를 태운다.
  if(!/^https?:\/\//.test(u))return u;
  return 'https://images.weserv.nl/?url='+encodeURIComponent(u.replace(/^https?:\/\//,''))+'&w=160&h=120&fit=cover&output=webp&q=74';
}
function thumbFail(el){
  const full=el.getAttribute('data-full');
  if(full&&el.src!==full){el.src=full;el.removeAttribute('data-full');return;}
  const cls=el.classList.contains('mth')?'mth-none':'th-none';
  el.outerHTML='<div class="'+cls+'"></div>';
}

// 사진 클릭 시 크게 보기. 이미 떠 있는 썸네일을 즉시 확대해서 보여주고(캐시라 대기시간 없음),
// 그 사이 원본을 백그라운드에서 받아 오면 교체한다 — 리사이즈 프록시 왕복을 기다리지 않아도 됨.
function openLightbox(el){
  const thumbSrc=el.currentSrc||el.src;
  const full=el.getAttribute('data-full')||thumbSrc;
  if(!full&&!thumbSrc)return;
  const li=$('lightboxImg');
  li.classList.add('loading');
  li.src=thumbSrc;
  li.setAttribute('data-full',full);
  $('lightbox').classList.add('on');
  document.body.style.overflow='hidden';
  if(full&&full!==thumbSrc){
    const hi=new Image();
    hi.onload=()=>{ if(li.getAttribute('data-full')===full){ li.src=full; li.classList.remove('loading'); } };
    hi.onerror=()=>{ li.classList.remove('loading'); };
    hi.src=full;
  }else{
    li.classList.remove('loading');
  }
}
function closeLightbox(){
  $('lightbox').classList.remove('on');
  $('lightboxImg').removeAttribute('src');
  $('lightboxImg').classList.remove('loading');
  document.body.style.overflow='';
}

function mediaOf(p){
  // 상품 객체가 사진·스펙을 직접 들고 있다(JSON 스키마). 없으면 사진 없이 표시.
  if(!p.img&&!(p.spec&&p.spec.length))return null;
  return {img:p.img||'',spec:p.spec||[],link:p.url||''};
}
function priceCell(p){
  if(!isAdmin())return '<span class="pinq">별도 문의</span>'+(p.__edited?'<span class="editedTag">수정됨</span>':'');
  if(p.price.cur==null)return '<span class="pask editable" data-edit-price="'+p.id+'" title="클릭해서 가격 입력">수량·단가 문의</span>';
  const oldh=(p.price.old!=null&&p.price.old!==p.price.cur)?'<span class="pold">'+won(p.price.old)+'원</span>':'';
  return oldh+'<span class="pcur editable" data-edit-price="'+p.id+'" title="클릭해서 가격 수정">'+won(p.price.cur)+'<small>원</small></span>'
       +(p.__edited?'<span class="editedTag">수정됨</span>':'');
}
function changeCell(p){
  if(!isAdmin())return '';
  const o=p.price.old,c=p.price.cur;
  if(o==null||c==null||o===c||o===0)return '<span class="chg flat">—</span>';
  const diff=c-o,pct=diff/o*100,dir=diff>0?'up':'down';
  return '<span class="chg '+dir+'">'+(diff>0?'▲':'▼')+won(Math.abs(diff))
       +'<span class="pct">'+(diff>0?'+':'')+pct.toFixed(1)+'%</span></span>';
}
function row(p,showWh){
  const m=mediaOf(p);
  const th=(m&&m.img)
    ?'<img class="th" src="'+esc(thumbUrl(m.img))+'" data-full="'+esc(m.img)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="thumbFail(this)">'
    :'<div class="th-none"></div>';
  const href=(m&&m.link)||p.url||'';   // 캐시의 링크가 최신(링크 시트 정본) — 유통시트 링크보다 우선
  const nm=href?('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>'):esc(p.name);
  const whName=showWh?p.wh:(p.srcWh||'');
  const taxTx=(p.tax&&p.tax.indexOf('과세')>=0&&p.tax.indexOf('면')<0);
  const tags=[
    whName?'<span class="wh">📦 '+esc(whName)+'</span>':'',
    p.tax?'<span class="'+(taxTx?'tx':'')+'">'+esc(p.tax)+'</span>':'',
    esc(p.cat||'')
  ].filter(Boolean).join(' · ');
  const specs=[];
  if(m&&m.spec&&m.spec.length)specs.push(esc(m.spec.join(' · ')));
  if(p.ref)specs.push(esc(p.ref.slice(0,60)));
  if(p.exp)specs.push('유통기한 '+esc(p.exp));
  const ship=p.ship<0?'—':(p.ship>0
    ?((p.courier?esc(p.courier.split('/')[0])+' ':'')+'<b>'+won(p.ship)+'</b>')
    :'<span class="free">무료배송</span>');
  return '<tr><td class="item"><div class="itemcell">'+th
    +'<div><div class="iname"><span>'+nm+'</span><button class="cpbtn" data-cp="'+esc(p.name)+'" title="상품명 복사">📋</button></div>'
    +(tags?'<div class="itag">'+tags+'</div>':'')+'</div></div></td>'
    +'<td class="spec">'+(specs.length?specs.join('<br>'):'—')+'</td>'
    +'<td class="r">'+priceCell(p)+'</td>'
    +'<td class="r">'+changeCell(p)+'</td>'
    +'<td class="ship">'+ship+'</td>'
    +'<td class="cut">'+(esc(p.cut)||'—')+'</td></tr>';
}
// 표는 컬럼이 6개라 좁은 화면에서 가로 스크롤이 강제됨 — 720px 아래에서는
// 같은 데이터를 세로로 쌓는 카드로 렌더링한다 (row()와 같은 값 계산, 마크업만 다름).
function cardHtml(p,showWh){
  const m=mediaOf(p);
  const th=(m&&m.img)
    ?'<img class="mth" src="'+esc(thumbUrl(m.img))+'" data-full="'+esc(m.img)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="thumbFail(this)">'
    :'<div class="mth-none"></div>';
  const href=(m&&m.link)||p.url||'';
  const nm=href?('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>'):esc(p.name);
  const whName=showWh?p.wh:(p.srcWh||'');
  const taxTx=(p.tax&&p.tax.indexOf('과세')>=0&&p.tax.indexOf('면')<0);
  const tags=[
    whName?'<span class="wh">📦 '+esc(whName)+'</span>':'',
    p.tax?'<span class="'+(taxTx?'tx':'')+'">'+esc(p.tax)+'</span>':'',
    esc(p.cat||'')
  ].filter(Boolean).join(' · ');
  const specs=[];
  if(m&&m.spec&&m.spec.length)specs.push(esc(m.spec.join(' · ')));
  if(p.ref)specs.push(esc(p.ref.slice(0,60)));
  if(p.exp)specs.push('유통기한 '+esc(p.exp));
  const ship=p.ship<0?'—':(p.ship>0
    ?((p.courier?esc(p.courier.split('/')[0])+' ':'')+'<b>'+won(p.ship)+'</b>')
    :'<span class="free">무료배송</span>');
  const hasChg=p.price.old!=null&&p.price.cur!=null&&p.price.old!==p.price.cur;
  return '<div class="mcard"><div class="mtop">'+th+'<div class="mhead">'
    +'<div class="mname"><span>'+nm+'</span><button class="cpbtn" data-cp="'+esc(p.name)+'" title="상품명 복사">📋</button></div>'
    +(tags?'<div class="itag">'+tags+'</div>':'')+'</div></div>'
    +(specs.length?'<div class="mspec">'+specs.join('<br>')+'</div>':'')
    +'<div class="mfoot"><div class="mprice">'+priceCell(p)+(hasChg?changeCell(p):'')+'</div>'
    +'<div class="mship">'+ship+(p.cut?'<br>'+esc(p.cut):'')+'</div></div></div>';
}
function buildRail(){
  const rail=$('rail');
  rail.querySelectorAll('.wtab').forEach(n=>n.remove());
  GROUPS.forEach((g,i)=>{
    const b=document.createElement('button');
    b.className='wtab'+(i===st.wi?' on':'');
    b.innerHTML='<span class="n">'+esc(g.wh)+'</span><span class="c">'+g.products.length+'</span>';
    b.onclick=()=>{st.wi=i;buildRail();render();};
    rail.appendChild(b);
  });
}
function sortList(list){
  if(st.sort==='sheet')return list;
  const val=p=>(p.price.cur==null?-1:p.price.cur);
  const chg=p=>{const o=p.price.old,c=p.price.cur;return(o!=null&&c!=null&&o!==0)?Math.abs((c-o)/o):-1;};
  const arr=list.slice();
  if(st.sort==='hi')arr.sort((a,b)=>val(b)-val(a));
  else if(st.sort==='lo')arr.sort((a,b)=>val(a)-val(b));
  else if(st.sort==='chg')arr.sort((a,b)=>chg(b)-chg(a));
  else arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  return arr;
}
function render(){
  const q=st.q.toLowerCase();
  let list,showWh,headName,headMeta;
  if(q){
    list=[];GROUPS.forEach(g=>g.products.forEach(p=>{if(p.name.toLowerCase().indexOf(q)>=0)list.push(Object.assign({wh:g.wh},p));}));
    showWh=true;
    headName='전체 창고 검색';
    headMeta='"'+esc(st.q)+'" · <b>'+list.length+'</b>건 · 합포장은 같은 창고끼리만';
  }else{
    const g=GROUPS[st.wi];
    if(!g){$('tb').innerHTML='';$('cardWrap').innerHTML='';return;}
    list=g.products;
    showWh=false;   // 창고 뷰에선 행마다 시트의 '창고명'(srcWh)을 쓴다 — 검색 뷰에서만 그룹명(p.wh)을 붙인다
    const ships=list.map(p=>p.ship).filter(v=>v>0);
    const base=ships.length?Math.max.apply(null,ships):0;
    headName=g.wh+(g.mixed?'':' 창고');
    headMeta='<b>'+list.length+'</b>개 품목 · '+(base>0?'기본 배송비 <b>'+won(base)+'원</b>':'<b>무료배송</b>')
      +' · '+(g.mixed?'상품마다 창고가 달라요':'이 창고 안에서만 합포장');
  }
  $('shName').textContent=headName;
  $('shMeta').innerHTML=headMeta;
  const sorted=sortList(list);
  $('tb').innerHTML=sorted.length
    ?sorted.map(p=>row(p,showWh)).join('')
    :'<tr class="emptyrow"><td colspan="6">검색 결과가 없습니다.</td></tr>';
  // 표(desktop)·카드(모바일) 둘 다 채워두고 CSS 미디어쿼리로 하나만 보여준다 —
  // 브레이크포인트를 JS에서 따로 안 맞춰도 되니 리사이즈·회전에도 항상 맞는 쪽이 보인다.
  $('cardWrap').innerHTML=sorted.length
    ?sorted.map(p=>cardHtml(p,showWh)).join('')
    :'<div class="mempty">검색 결과가 없습니다.</div>';
}
document.addEventListener('click',e=>{
  if(e.target.closest('#themeToggle')){
    applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
    return;
  }
  const img=e.target.closest('.th,.mth');
  if(img){openLightbox(img);return;}
  if(e.target.id==='lightbox'||e.target.id==='lightboxClose'){closeLightbox();return;}
  const cp=e.target.closest('.cpbtn');
  if(cp){navigator.clipboard.writeText(cp.getAttribute('data-cp')).then(()=>toast('상품명 복사됨'));return;}
  const editEl=e.target.closest('[data-edit-price]');
  if(editEl){
    if(!isAdmin())return;
    const id=editEl.getAttribute('data-edit-price');
    const p=PBYID[id];if(!p)return;
    const input=document.createElement('input');
    input.type='text';input.inputMode='numeric';input.className='pedit';
    input.value=p.price.cur!=null?p.price.cur:'';
    input.setAttribute('data-pid',id);
    editEl.replaceWith(input);
    input.focus();input.select();
    return;
  }
  if(e.target.id==='adminLink'){e.preventDefault();if(isAdmin())lockAdmin();else tryUnlock();return;}
  if(e.target.id==='btnLock'){lockAdmin();return;}
});
document.addEventListener('focusout',e=>{
  if(e.target.classList&&e.target.classList.contains('pedit')){
    commitPriceEdit(e.target.getAttribute('data-pid'),e.target.value);
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.classList&&e.target.classList.contains('pedit')){
    if(e.key==='Enter')e.target.blur();
    if(e.key==='Escape'){e.target.value='';e.target.blur();}
    return;
  }
  if(e.key==='Escape')closeLightbox();
});
$('exportBtn').addEventListener('click',()=>{
  const doc=buildExportJson();
  const blob=new Blob([JSON.stringify(doc,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='products.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('products.json 다운로드됨 — data/products.json에 덮어쓰고 커밋해주세요');
});
$('q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});
$('sorts').addEventListener('click',e=>{
  const b=e.target.closest('.sortbtn');if(!b)return;
  st.sort=b.getAttribute('data-s');
  $('sorts').querySelectorAll('.sortbtn').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
bumpViewCounter();
(async()=>{
  try{
    GROUPS = await loadCatalog();
    let __pid=0;
    GROUPS.forEach(g=>g.products.forEach(p=>{
      p.cat = p.cat0 || catOf(p.name);
      p.id = 'p'+(__pid++);
      PBYID[p.id] = p;
    }));
    let total=0,up=0,down=0;
    GROUPS.forEach(g=>g.products.forEach(p=>{
      total++;
      if(p.price.old!=null&&p.price.cur!=null){
        if(p.price.cur>p.price.old)up++; else if(p.price.cur<p.price.old)down++;
      }
    }));
    $('roItems').textContent=won(total);
    $('roWh').textContent=GROUPS.length;
    $('roUp').textContent=up;
    $('roDown').textContent=down;
    $('sub').textContent='거래처 전용'+(DOC_META.updatedAt?' · 마지막 동기화 '+DOC_META.updatedAt:'');
    $('ft').innerHTML='마스터 유통 · 거래처 상품 시세판'
      +(DOC_META.updatedAt?'<br>마지막 동기화 <b>'+esc(DOC_META.updatedAt)+'</b>':'')
      +' · <a href="#" id="adminLink">관리자</a>';
    $('load').style.display='none';
    $('layout').style.display='grid';
    updateAdminUI();
    buildRail();render();
  }catch(e){
    $('load').innerHTML='⚠️ 상품을 불러오지 못했습니다.<div class="err">'+esc(e.message||String(e))+'</div>'
      +'<button class="retry" onclick="location.reload()">다시 시도</button>';
  }
})();

</script></body></html>
